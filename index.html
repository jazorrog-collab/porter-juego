<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evaluación de las 5 Fuerzas de Porter</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f2f2f2;
        padding: 0;
        text-align: center;
    }

    h1 {
        background: #003366;
        color: white;
        padding: 20px;
        margin: 0 0 20px 0;
    }

    #contenedor {
        width: 90%;
        margin: auto;
        max-width: 900px;
    }

    button {
        padding: 12px 20px;
        margin: 10px;
        border: none;
        border-radius: 6px;
        background: #0055aa;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #003f7d;
    }

    .btn-sec {
        background: #777;
    }
    .btn-sec:hover {
        background: #555;
    }

    #infoTexto {
        padding: 15px;
        background: white;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
        text-align: left;
    }

    #quiz {
        display: none;
    }

    .pregunta {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .opcion {
        display: block;
        width: 100%;
        text-align: left;
        max-width: 600px;
        margin: 10px auto;
        padding: 12px;
        background: white;
        border-radius: 8px;
        border: 2px solid #ccc;
        cursor: pointer;
        transition: 0.2s;
    }

    .opcion:hover {
        background: #e9e9e9;
    }

    #ayudaTexto {
        margin-top: 10px;
        padding: 10px;
        background: #fff5cc;
        border-left: 5px solid #ffcc00;
        display: none;
    }

    #final {
        display: none;
        padding: 20px;
        background: white;
        border-radius: 12px;
    }

    #cronometro {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 10px;
        background: #003366;
        color: white;
        display: inline-block;
        padding: 6px 14px;
        border-radius: 8px;
    }
</style>
</head>
<body>

<h1>Evaluación – Las 5 Fuerzas de Porter</h1>

<div id="contenedor">

    <button onclick="mostrarInfo('bibliografia')">Bibliografía</button>
    <button onclick="mostrarInfo('obras')">Obras</button>
    <button onclick="mostrarInfo('publicaciones')">Publicaciones</button>

    <div id="infoTexto"></div>

    <button onclick="iniciarQuiz()">Iniciar Evaluación</button>

    <div id="quiz">
        <div id="cronometro">00:00</div>
        <div id="pregunta" class="pregunta"></div>

        <div id="opciones"></div>

        <button class="btn-sec" onclick="usarAyuda()">Ayuda (3)</button>
        <div id="ayudaTexto"></div>
    </div>

    <div id="final">
        <h2>¡Has completado la evaluación!</h2>
        <p id="puntajeFinal"></p>
        <p id="tiempoFinal"></p>
        <button onclick="location.reload()">Reiniciar</button>
    </div>

</div>

<!-- SONIDOS -->
<audio id="sonidoCorrecto" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="sonidoIncorrecto" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-buzz-954.mp3"></audio>
<audio id="sonidoAyuda" src="https://assets.mixkit.co/sfx/preview/mixkit-fast-positive-notification-955.mp3"></audio>
<audio id="sonidoMeta" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
/* ─────────────────────────────────────────
   SECCIONES INFORMATIVAS
────────────────────────────────────────── */
function mostrarInfo(tipo) {
    const div = document.getElementById("infoTexto");

    const textos = {
        bibliografia: `
        <h3>Bibliografía</h3>
        <p>Michael E. Porter, profesor de Harvard, es reconocido mundialmente por sus investigaciones sobre estrategia competitiva y ventajas sostenibles. Su obra más influyente, "Competitive Strategy" (1980), introdujo el modelo de las Cinco Fuerzas, una herramienta esencial para analizar industrias y determinar el nivel de competencia. Su bibliografía incluye estudios sobre ventaja competitiva, políticas públicas, desarrollo económico, clústeres industriales y competitividad nacional. Porter también ha colaborado con organizaciones internacionales para aplicar sus modelos en el desarrollo de países, fortaleciendo la innovación, la productividad y la gestión empresarial. Su enfoque combina rigor académico y aplicabilidad práctica.</p>
        `,
        obras: `
        <h3>Obras Reconocidas</h3>
        <p>Entre sus obras destacan "Competitive Strategy" (1980) y "Competitive Advantage" (1985), consideradas pilares fundamentales de la estrategia empresarial contemporánea. En estos libros, Porter describe cómo las empresas pueden posicionarse estratégicamente y construir ventajas sostenibles. También publicó "The Competitive Advantage of Nations" (1990), donde desarrolla el concepto de clústeres y examina cómo los países pueden mejorar su competitividad. Su obra incluye múltiples artículos en Harvard Business Review sobre estrategia, salud, responsabilidad social corporativa y el valor compartido. Cada obra de Porter ha influido significativamente en la forma como las organizaciones analizan mercados y desarrollan estrategias.</p>
        `,
        publicaciones: `
        <h3>Publicaciones Destacadas</h3>
        <p>Michael Porter ha publicado cientos de artículos académicos y de divulgación. Entre los más influyentes se encuentran “What is Strategy?”, donde explica la importancia de la diferenciación y la creación de valor único; y “Creating Shared Value”, donde redefine la relación entre empresa y sociedad. También ha publicado informes sobre competitividad nacional para gobiernos y organizaciones globales. Sus publicaciones abarcan temas como sistemas de salud, responsabilidad corporativa, productividad, desarrollo económico territorial y estrategias industriales. Su trabajo se caracteriza por ofrecer marcos analíticos sólidos que permiten a líderes empresariales y políticos tomar decisiones estratégicas con mayor claridad.</p>
        `
    };

    div.innerHTML = textos[tipo];
    div.style.display = "block";
}

/* ─────────────────────────────────────────
   QUIZ – PREGUNTAS
────────────────────────────────────────── */
const preguntas = [
    {
        pregunta: "¿Qué analiza la fuerza de 'Rivalidad entre competidores'?",
        opciones: [
            "El nivel de competencia directa dentro de la industria",
            "El número de proveedores existentes",
            "El poder de negociación de los clientes",
            "Las barreras de entrada del mercado"
        ],
        correcta: 0,
        pista: "Esta fuerza analiza la intensidad competitiva entre empresas de la misma industria."
    },
    {
        pregunta: "¿Qué representa la amenaza de nuevos entrantes?",
        opciones: [
            "El ingreso de empresas que pueden aumentar la competencia",
            "El riesgo de sustitutos",
            "La dependencia de los clientes",
            "El control de precios por parte de proveedores"
        ],
        correcta: 0,
        pista: "Evalúa qué tan fácil es ingresar a la industria."
    },
    {
        pregunta: "¿Qué determina el poder de negociación de los proveedores?",
        opciones: [
            "La cantidad de alternativas de suministro",
            "El marketing utilizado por las empresas",
            "El tamaño de la industria",
            "Los clientes potenciales"
        ],
        correcta: 0,
        pista: "Cuando hay pocos proveedores, pueden imponer condiciones."
    },
    {
        pregunta: "¿Qué representa la amenaza de productos sustitutos?",
        opciones: [
            "Productos que pueden reemplazar la oferta principal",
            "La entrada de nuevos competidores",
            "La rivalidad directa",
            "Las barreras de salida"
        ],
        correcta: 0,
        pista: "Es clave analizar alternativas que resuelvan el mismo problema del cliente."
    }
];

let index = 0;
let puntaje = 0;
let ayudas = 3;
let tiempo = 0;
let intervalo;

function iniciarQuiz() {
    document.getElementById("quiz").style.display = "block";
    document.getElementById("infoTexto").style.display = "none";

    intervalo = setInterval(() => {
        tiempo++;
        document.getElementById("cronometro").textContent = formatoTiempo(tiempo);
    }, 1000);

    cargarPregunta();
}

function cargarPregunta() {
    document.getElementById("ayudaTexto").style.display = "none";
    let p = preguntas[index];
    document.getElementById("pregunta").innerText = p.pregunta;

    let cont = document.getElementById("opciones");
    cont.innerHTML = "";

    p.opciones.forEach((op, i) => {
        let div = document.createElement("div");
        div.className = "opcion";
        div.innerText = op;
        div.onclick = () => responder(i);
        cont.appendChild(div);
    });
}

function vibrar() {
    if (navigator.vibrate) {
        navigator.vibrate(120);
    }
}

function responder(i) {
    vibrar();

    if (i === preguntas[index].correcta) {
        puntaje += 1;
        document.getElementById("sonidoCorrecto").play();
    } else {
        document.getElementById("sonidoIncorrecto").play();
    }

    index++;

    if (index >= preguntas.length) {
        finalizar();
    } else {
        cargarPregunta();
    }
}

function usarAyuda() {
    if (ayudas <= 0) return;

    document.getElementById("sonidoAyuda").play();
    vibrar();

    ayudas--;
    puntaje -= 0.10;

    document.querySelector(".btn-sec").innerText = `Ayuda (${ayudas})`;

    const pista = preguntas[index].pista;
    const box = document.getElementById("ayudaTexto");
    box.style.display = "block";
    box.innerText = "Pista: " + pista;
}

function finalizar() {
    clearInterval(intervalo);

    document.getElementById("quiz").style.display = "none";
    document.getElementById("final").style.display = "block";

    document.getElementById("sonidoMeta").play();

    document.getElementById("puntajeFinal").innerText =
        `Puntaje final: ${puntaje.toFixed(2)} / ${preguntas.length}`;

    document.getElementById("tiempoFinal").innerText =
        `Tiempo total: ${formatoTiempo(tiempo)}`;
}

function formatoTiempo(seg) {
    let m = Math.floor(seg / 60);
    let s = seg % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
</script>

</body>
</html>
