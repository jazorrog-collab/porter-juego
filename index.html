<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evaluación de las 5 Fuerzas de Porter</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f2f2f2;
        padding: 0;
        text-align: center;
    }

    h1 {
        background: #003366;
        color: white;
        padding: 20px;
        margin: 0 0 20px 0;
    }

    #contenedor {
        width: 90%;
        margin: auto;
        max-width: 900px;
    }

    button {
        padding: 12px 20px;
        margin: 10px;
        border: none;
        border-radius: 6px;
        background: #0055aa;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #003f7d;
    }

    .btn-sec {
        background: #777;
    }
    .btn-sec:hover {
        background: #555;
    }

    #infoTexto {
        padding: 15px;
        background: white;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
        text-align: left;
    }

    #quiz {
        display: none;
    }

    .pregunta {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .opcion {
        display: block;
        width: 100%;
        text-align: left;
        max-width: 600px;
        margin: 10px auto;
        padding: 12px;
        background: white;
        border-radius: 8px;
        border: 2px solid #ccc;
        cursor: pointer;
        transition: 0.2s;
    }

    .opcion:hover {
        background: #e9e9e9;
    }

    #ayudaTexto {
        margin-top: 10px;
        padding: 10px;
        background: #fff5cc;
        border-left: 5px solid #ffcc00;
        display: none;
    }

    #final {
        display: none;
        padding: 20px;
        background: white;
        border-radius: 12px;
    }

    #cronometro {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 10px;
        background: #003366;
        color: white;
        display: inline-block;
        padding: 6px 14px;
        border-radius: 8px;
    }
</style>
</head>
<body>

<h1>Evaluación – Las 5 Fuerzas de Porter</h1>

<div id="contenedor">

    <button onclick="mostrarInfo('bibliografia')">Bibliografía</button>
    <button onclick="mostrarInfo('obras')">Obras</button>
    <button onclick="mostrarInfo('publicaciones')">Publicaciones</button>

    <div id="infoTexto"></div>

    <button onclick="iniciarQuiz()">Iniciar Evaluación</button>

    <div id="quiz">
        <div id="cronometro">00:00</div>
        <div id="pregunta" class="pregunta"></div>

        <div id="opciones"></div>

        <button class="btn-sec" onclick="usarAyuda()">Ayuda (3)</button>
        <div id="ayudaTexto"></div>
    </div>

    <div id="final">
        <h2>¡Has completado la evaluación!</h2>
        <p id="puntajeFinal"></p>
        <p id="tiempoFinal"></p>
        <button onclick="location.reload()">Reiniciar</button>
    </div>

</div>

<!-- SONIDOS -->
<audio id="sonidoCorrecto" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="sonidoIncorrecto" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-buzz-954.mp3"></audio>
<audio id="sonidoAyuda" src="https://assets.mixkit.co/sfx/preview/mixkit-fast-positive-notification-955.mp3"></audio>
<audio id="sonidoMeta" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
/* ─────────────────────────────────────────
   SECCIONES INFORMATIVAS
────────────────────────────────────────── */
function mostrarInfo(tipo) {
    const div = document.getElementById("infoTexto");

    const textos = {
        bibliografia: `
        <h3>Bibliografía</h3>
        <p>Michael E. Porter es uno de los académicos más influyentes en el campo de la estrategia empresarial. Su trayectoria inicia en la Universidad de Harvard, donde desarrolló modelos fundamentales para comprender la competitividad. Entre sus principales contribuciones se encuentra el modelo de las Cinco Fuerzas, una de las herramientas más utilizadas para analizar industrias y mercados. Su bibliografía abarca obras relacionadas con competitividad nacional, clústeres productivos, estrategia corporativa y políticas públicas de desarrollo económico. Ha trabajado con gobiernos y organizaciones internacionales para mejorar la productividad, aplicando principios estratégicos a la economía territorial. Su enfoque siempre ha buscado unir rigurosidad analítica con utilidad práctica.</p>
        `,
        obras: `
        <h3>Obras Reconocidas</h3>
        <p>Porter ha escrito obras que han transformado la forma en que las empresas entienden la competencia. Su libro más influyente, “Competitive Strategy” (1980), introdujo conceptos como la rivalidad, las barreras de entrada y los sustitutos. Posteriormente, con “Competitive Advantage” (1985), profundizó en cómo las empresas pueden crear y sostener ventajas estratégicas. “The Competitive Advantage of Nations” (1990) amplía el análisis a economías completas, introduciendo el famoso “diamante de Porter”. Cada una de estas obras ha sido traducida a múltiples idiomas y sigue siendo referencia obligatoria en escuelas de negocios. Hoy, sus ideas continúan guiando decisiones estratégicas en sectores empresariales y gubernamentales.</p>
        `,
        publicaciones: `
        <h3>Publicaciones Destacadas</h3>
        <p>Michael Porter ha producido artículos influyentes que han redefinido conceptos clave en la estrategia empresarial. Entre ellos destaca “What is Strategy?”, un artículo que diferencia claramente entre eficiencia operativa y estrategia competitiva. También es ampliamente reconocido “Creating Shared Value”, donde propone que las empresas pueden generar beneficios económicos creando simultáneamente valor social. Sus publicaciones abarcan también temas como sistemas de salud, competitividad nacional y responsabilidad corporativa. Muchos de sus artículos han sido publicados en Harvard Business Review y son usados como referencia en programas de formación ejecutiva, escuelas de negocios y consultoría especializada en estrategia.</p>
        `
    };

    div.innerHTML = textos[tipo];
    div.style.display = "block";
}

/* ─────────────────────────────────────────
   QUIZ – PREGUNTAS
────────────────────────────────────────── */

const preguntas = [
    {
        pregunta: "¿Cuál es el objetivo principal del modelo de las 5 Fuerzas de Porter?",
        opciones: [
            "Analizar la estructura competitiva de una industria",
            "Determinar la rentabilidad individual de una empresa",
            "Evaluar el desempeño financiero anual",
            "Medir la lealtad de los clientes"
        ],
        correcta: 0,
        pista: "Sirve para entender qué tan atractiva es una industria."
    },

    {
        pregunta: "¿Qué factor aumenta la rivalidad entre competidores?",
        opciones: [
            "Mercado saturado con productos similares",
            "Altas barreras de entrada",
            "Clientes con poca información",
            "Proveedores muy diversos"
        ],
        correcta: 0,
        pista: "Mientras más luchan por los mismos clientes, mayor es la rivalidad."
    },

    {
        pregunta: "¿Qué aumenta el poder de negociación de los clientes?",
        opciones: [
            "Existen muchas alternativas para ellos",
            "La oferta es limitada",
            "El proveedor es dominante",
            "Los productos son altamente diferenciados"
        ],
        correcta: 0,
        pista: "Si hay varias opciones, tienen poder de elegir."
    },

    {
        pregunta: "¿Qué condición incrementa la amenaza de nuevos entrantes?",
        opciones: [
            "Bajas barreras de entrada",
            "Alta inversión inicial",
            "Regulaciones estrictas",
            "Economías de escala fuertes"
        ],
        correcta: 0,
        pista: "Cuanto más fácil entrar, mayor la amenaza."
    },

    {
        pregunta: "¿Qué define a un producto sustituto?",
        opciones: [
            "Satisface la misma necesidad de forma diferente",
            "Es vendido por la misma empresa",
            "Es un accesorio del producto principal",
            "Solo existe en mercados externos"
        ],
        correcta: 0,
        pista: "Ofrece una alternativa indirecta."
    },

    {
        pregunta: "¿Cuál situación reduce el poder de los proveedores?",
        opciones: [
            "Existen múltiples proveedores disponibles",
            "El proveedor es único",
            "Los insumos son altamente especializados",
            "Los costos de cambio son elevados"
        ],
        correcta: 0,
        pista: "Cuantas más opciones tengas, menos poder tienen ellos."
    },

    {
        pregunta: "¿Qué elemento intensifica la competencia?",
        opciones: [
            "Crecimiento lento del mercado",
            "Altos costos de salida",
            "Alta diferenciación",
            "Fuerte fidelidad de los clientes"
        ],
        correcta: 0,
        pista: "Si el mercado no crece, se pelea por los mismos clientes."
    },

    {
        pregunta: "¿Qué factor reduce la amenaza de nuevos entrantes?",
        opciones: [
            "Patentes y propiedad intelectual",
            "Bajo capital inicial",
            "Escasa regulación",
            "Alta disponibilidad de proveedores"
        ],
        correcta: 0,
        pista: "Las barreras legales limitan la entrada."
    },

    {
        pregunta: "¿Qué aumenta el poder de negociación de los proveedores?",
        opciones: [
            "Ofrecen un producto único o difícil de sustituir",
            "Hay muchos competidores",
            "Los clientes tienen mucha información",
            "La demanda es baja"
        ],
        correcta: 0,
        pista: "Si solo ellos pueden proveerlo, tienen poder."
    },

    {
        pregunta: "¿Qué ocurre cuando los costos de cambio son altos?",
        opciones: [
            "Los clientes tienen menos poder",
            "La amenaza de sustitutos aumenta",
            "La rivalidad desaparece",
            "Las barreras bajan"
        ],
        correcta: 0,
        pista: "Entre más difícil cambiar, menos poder tiene el cliente."
    },

    {
        pregunta: "¿Qué implica una alta disponibilidad de sustitutos?",
        opciones: [
            "Los consumidores pueden cambiar fácilmente",
            "Los proveedores controlan toda la industria",
            "No existe competencia indirecta",
            "Los clientes pierden poder"
        ],
        correcta: 0,
        pista: "A más opciones, más riesgo para la empresa."
    },

    /* LAS 4 PREGUNTAS ADICIONALES */
    {
        pregunta: "¿Qué analiza la fuerza de 'Rivalidad entre competidores'?",
        opciones: [
            "El nivel de competencia directa en la industria",
            "El número de proveedores existentes",
            "El poder de negociación de los clientes",
            "Las barreras de entrada"
        ],
        correcta: 0,
        pista: "Analiza qué tan fuerte es la competencia directa."
    },

    {
        pregunta: "¿Qué representa la amenaza de nuevos entrantes?",
        opciones: [
            "El ingreso de empresas que pueden aumentar la competencia",
            "El riesgo de sustitutos",
            "La dependencia de los clientes",
            "El control de precios de proveedores"
        ],
        correcta: 0,
        pista: "Evalúa qué tan fácil es entrar a la industria."
    },

    {
        pregunta: "¿Qué determina el poder de negociación de los proveedores?",
        opciones: [
            "La cantidad de alternativas de suministro",
            "El marketing de las empresas",
            "El tamaño de la industria",
            "Los clientes potenciales"
        ],
        correcta: 0,
        pista: "Si hay pocas fuentes, tienen poder."
    },

    {
        pregunta: "¿Qué representa la amenaza de productos sustitutos?",
        opciones: [
            "Productos que pueden reemplazar la oferta principal",
            "La entrada de competidores",
            "La rivalidad directa",
            "Las barreras de salida"
        ],
        correcta: 0,
        pista: "Son alternativas que resuelven la misma necesidad."
    }
];

let index = 0;
let puntaje = 0;
let ayudas = 3;
let tiempo = 0;
let intervalo;

function iniciarQuiz() {
    document.getElementById("quiz").style.display = "block";
    document.getElementById("infoTexto").style.display = "none";

    intervalo = setInterval(() => {
        tiempo++;
        document.getElementById("cronometro").textContent = formatoTiempo(tiempo);
    }, 1000);

    cargarPregunta();
}

function cargarPregunta() {
    document.getElementById("ayudaTexto").style.display = "none";
    let p = preguntas[index];
    document.getElementById("pregunta").innerText = p.pregunta;

    let cont = document.getElementById("opciones");
    cont.innerHTML = "";

    p.opciones.forEach((op, i) => {
        let div = document.createElement("div");
        div.className = "opcion";
        div.innerText = op;
        div.onclick = () => responder(i);
        cont.appendChild(div);
    });
}

function vibrar() {
    if (navigator.vibrate) {
        navigator.vibrate([80, 50, 80]);
    }
}

function responder(i) {
    vibrar();

    if (i === preguntas[index].correcta) {
        puntaje += 1;
        document.getElementById("sonidoCorrecto").play();
    } else {
        document.getElementById("sonidoIncorrecto").play();
    }

    index++;

    if (index >= preguntas.length) {
        finalizar();
    } else {
        cargarPregunta();
    }
}

function usarAyuda() {
    if (ayudas <= 0) return;

    document.getElementById("sonidoAyuda").play();
    vibrar();

    ayudas--;
    puntaje -= 0.10;

    document.querySelector(".btn-sec").innerText = `Ayuda (${ayudas})`;

    const pista = preguntas[index].pista;
    const box = document.getElementById("ayudaTexto");
    box.style.display = "block";
    box.innerText = "Pista: " + pista;
}

function finalizar() {
    clearInterval(intervalo);

    document.getElementById("quiz").style.display = "none";
    document.getElementById("final").style.display = "block";

    document.getElementById("sonidoMeta").play();

    document.getElementById("puntajeFinal").innerText =
        `Puntaje final: ${puntaje.toFixed(2)} / ${preguntas.length}`;

    document.getElementById("tiempoFinal").innerText =
        `Tiempo total: ${formatoTiempo(tiempo)}`;
}

function formatoTiempo(seg) {
    let m = Math.floor(seg / 60);
    let s = seg % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
</script>

</body>
</html>
