<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Porter</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(160deg,#1c1f26,#2c3240);
        margin:0;
        padding:0;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        text-align:center;
    }

    .container{
        width:90%;
        max-width:600px;
        background:#ffffff10;
        padding:25px;
        border-radius:20px;
        box-shadow:0 0 20px #0006;
        backdrop-filter:blur(10px);
    }

    button{
        width:100%;
        padding:12px;
        background:#4d79ff;
        border:none;
        color:white;
        font-size:17px;
        border-radius:10px;
        margin-top:10px;
        cursor:pointer;
        transition:.2s;
    }
    button:hover{ background:#335fff; }

    .opt{
        background:#ffffff20;
    }
    .opt:hover{
        background:#ffffff35;
    }

    .title{
        font-size:28px;
        margin-bottom:20px;
        font-weight:bold;
    }

    .hidden{ display:none; }

    .home-menu button{
        background:#ffb84d;
    }

    .info-box{
        background:#ffffff18;
        padding:15px;
        border-radius:10px;
        margin-top:15px;
        text-align:left;
        font-size:15px;
        line-height:1.5;
    }
</style>
</head>
<body>

<div class="container">

    <!-- PANTALLA INICIO -->
    <div id="home">
        <div class="title">Quiz de Michael Porter</div>
        <button onclick="startGame()">Iniciar</button>

        <div class="home-menu">
            <button onclick="showInfo('bio')">Biografía</button>
            <button onclick="showInfo('obras')">Obras</button>
            <button onclick="showInfo('pubs')">Publicaciones</button>
        </div>
    </div>

    <!-- INFO -->
    <div id="info" class="hidden">
        <div class="title">Información</div>
        <div class="info-box" id="infoText"></div>
        <button onclick="goHome()">Volver</button>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="hidden">
        <div class="title" id="questionText"></div>
        <div id="options"></div>
        <button id="helpBtn" onclick="giveHint()">Ayuda (3)</button>
    </div>

    <!-- FINAL -->
    <div id="end" class="hidden">
        <div class="title">¡Quiz terminado!</div>
        <h2 id="scoreText"></h2>
        <button onclick="goHome()">Volver al inicio</button>
    </div>

</div>

<script>
/* ========= SONIDOS EN BASE64 (NO NECESITAS ARCHIVOS) ========= */
let correctSound = new Audio("data:audio/mp3;base64,SUQzBAAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjM3LjEwMAAAAAAAAAAAAAAA//tQxAADBQBCf2YAACQAAAACAAACcQCAAAAgAAABkYXRhAAAAAA==");
let wrongSound   = new Audio("data:audio/mp3;base64,SUQzBAAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjM3LjEwMAAAAAAAAAAAAAAA//tQxAABAgBCf2YAAAgAAAACAAACcQCAAAAgAAABkYXRhAAAAAA==");
let finishSound  = new Audio("data:audio/mp3;base64,SUQzBAAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjM3LjEwMAAAAAAAAAAAAAAA//tQxAABAQBif2YAABQAAAACAAACcQCAAAAgAAABkYXRhAAAAAA==");

/* ========= PREGUNTAS ========= */
let questions = [
    { q:"¿Qué modelo creó Porter para analizar industrias?", options:["5 fuerzas","Estrategia azul","3 pasos"], answer:0, hint:"Analiza la competencia" },
    { q:"¿Qué es la cadena de valor?", options:["Proveedores","Actividades internas","Ingresos"], answer:1, hint:"Describe cómo creas valor" },
    { q:"¿Qué busca la estrategia?", options:["Imitar","Ser diferente","Gastar menos"], answer:1, hint:"Implica diferenciación" },
    { q:"Una fuerza es:", options:["Marketing","Rivalidad","Clima"], answer:1, hint:"Competencia entre empresas" },
    { q:"¿Qué mide el diamante de Porter?", options:["Ventas","Competitividad","Publicidad"], answer:1, hint:"Nivel país" },
    { q:"¿Qué son sustitutos?", options:["Impuestos","Alternativas","Gerentes"], answer:1, hint:"Ej: taxi vs Uber" },
    { q:"¿Qué es valor compartido?", options:["Caridad","Social+económico","Solo dinero"], answer:1, hint:"Beneficia empresa y sociedad" },
    { q:"¿Qué define ventaja competitiva?", options:["Ahorrar","Publicidad","Diferencia difícil de copiar"], answer:2, hint:"Puede ser tecnología" },
    { q:"¿Qué es un cluster?", options:["Apps","Empresas agrupadas","Cloud"], answer:1, hint:"En un territorio" },
    { q:"¿Qué amenaza evalúa Porter?", options:["Nuevos entrantes","Precio","Gerencia"], answer:0, hint:"Nueva competencia" },
    { q:"Ejemplo de cadena de valor:", options:["Logística","Inversores","Contabilidad"], answer:0, hint:"Procesos internos" },
    { q:"La rivalidad aumenta cuando:", options:["Caros","Muchos competidores","Pocos"], answer:1, hint:"Más empresas → más rivalidad" },
    { q:"Un proveedor fuerte puede:", options:["Contratar","Subir costos","Vender más"], answer:1, hint:"Aumenta precios" },
    { q:"Un diferenciador común es:", options:["Marca","Impuestos","Salarios"], answer:0, hint:"Percepción del cliente" },
    { q:"Una estrategia clara evita:", options:["Innovar","Competir en todo","Planear"], answer:1, hint:"No puedes ser todo a la vez" },
    { q:"Una barrera de entrada es:", options:["Publicidad","Patentes","Ventas"], answer:1, hint:"Protege industria" },
    { q:"Porter nació en:", options:["Brasil","EEUU","México"], answer:1, hint:"En Norteamérica" },
    { q:"Las 5 fuerzas predicen:", options:["Salarios","Rentabilidad","Bonos"], answer:1, hint:"Ganancias del sector" },
    { q:"Ejemplo de sustituto:", options:["Hélice","Cable","Videollamadas vs viajes"], answer:2, hint:"Reducen la demanda del original" },
    { q:"¿Qué es estrategia?", options:["Copiar","Elegir qué no hacer","Improvisar"], answer:1, hint:"Límite claro" }
];

let current = 0;
let score = 0;
let helpLeft = 3;

/* ========= MOSTRAR INFO ========= */
function showInfo(type){
    document.getElementById("home").classList.add("hidden");
    document.getElementById("info").classList.remove("hidden");

    const infoText = document.getElementById("infoText");

    if(type==="bio"){
        infoText.innerHTML = `
            Michael E. Porter es un economista estadounidense reconocido 
            mundialmente por sus contribuciones al análisis estratégico y la 
            competitividad empresarial. Nacido en 1947, se convirtió en uno de 
            los académicos más influyentes de Harvard. Sus teorías han moldeado 
            cómo las empresas y los gobiernos comprenden la competencia, las 
            industrias y el desarrollo económico. Porter integró conceptos de 
            economía industrial con estrategia empresarial, creando herramientas 
            como las 5 Fuerzas, el Diamante de Competitividad y la Cadena de Valor.
        `;
    }
    if(type==="obras"){
        infoText.innerHTML = `
            Entre las obras más influyentes de Porter destacan “Competitive 
            Strategy” (1980), donde conceptualizó las 5 Fuerzas; “Competitive 
            Advantage” (1985), donde presenta la cadena de valor; y “The 
            Competitive Advantage of Nations” (1990), donde introduce el 
            Diamante de Porter. Su trabajo también abarca estrategia social, 
            valor compartido y competitividad territorial.
        `;
    }
    if(type==="pubs"){
        infoText.innerHTML = `
            Porter ha publicado decenas de artículos académicos en revistas 
            como Harvard Business Review. Entre los más influyentes se encuentran 
            “What is Strategy?”, “The Five Competitive Forces That Shape Strategy”, 
            y “Creating Shared Value”. Estas publicaciones han guiado tanto a 
            directivos como a gobiernos en el diseño de estrategias sostenibles.
        `;
    }
}

function goHome(){
    document.getElementById("info").classList.add("hidden");
    document.getElementById("end").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
}

/* ========= INICIAR ========= */
function startGame(){
    current = 0;
    score = 0;
    helpLeft = 3;

    document.getElementById("home").classList.add("hidden");
    document.getElementById("end").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");

    loadQuestion();
}

/* ========= CARGAR PREGUNTA ========= */
function loadQuestion(){
    const q = questions[current];
    document.getElementById("questionText").innerText = q.q;

    let opts = [...q.options];

    // Crear botones
    let html = "";
    opts.forEach((opt,i)=>{
        html += `<button class="opt" onclick="check(${i})">${opt}</button>`;
    });

    document.getElementById("options").innerHTML = html;
    document.getElementById("helpBtn").innerText = `Ayuda (${helpLeft})`;
}

/* ========= EVALUAR ========= */
function check(opt){
    const q = questions[current];

    if(opt===q.answer){
        score++;
        correctSound.play();
        if(navigator.vibrate) navigator.vibrate(120);
    } else {
        wrongSound.play();
        if(navigator.vibrate) navigator.vibrate([100,40,100]);
    }

    current++;
    if(current>=questions.length){
        endGame();
    } else {
        setTimeout(loadQuestion,400);
    }
}

/* ========= AYUDA ========= */
function giveHint(){
    if(helpLeft<=0) return;

    helpLeft--;
    score -= 0.5;

    alert("Pista: " + questions[current].hint);
    document.getElementById("helpBtn").innerText = `Ayuda (${helpLeft})`;
}

/* ========= FINAL ========= */
function endGame(){
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("end").classList.remove("hidden");
    document.getElementById("scoreText").innerText = `Puntaje final: ${score}`;
    finishSound.play();
}
</script>

</body>
</html>
