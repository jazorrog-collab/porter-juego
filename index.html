<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortesía: ¿Abres o cierras puertas?</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  margin: 0;
  padding: 10px;
}

.container {
  max-width: 420px;
  margin: auto;
  background: white;
  padding: 18px;
  border-radius: 15px;
  box-shadow: 0px 0px 12px rgba(0,0,0,0.1);
}

h1 {
  font-size: 18px;
  text-align: center;
}

.info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}

.progress {
  height: 6px;
  background: #ddd;
  border-radius: 5px;
  margin: 10px 0;
}

.progress-bar {
  height: 6px;
  background: #3498db;
  width: 0%;
  border-radius: 5px;
}

button {
  width: 100%;
  margin: 6px 0;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #3498db;
  color: white;
  font-size: 14px;
}

.result {
  margin-top: 8px;
  font-weight: bold;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
  <h1>¿Abres o cierras puertas?</h1>

  <div class="info">
    <span id="score">Puntaje: 0</span>
    <span id="timer">Tiempo: 12</span>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progress"></div>
  </div>

  <p id="question"></p>
  <div id="options"></div>
  <p class="result" id="result"></p>
</div>

<script>

const questions = [
  {
    type: "mc",
    q: "Un cliente molesto te reclama. ¿Qué haces?",
    options: [
      "Ignorarlo",
      "Responder igual",
      "Escuchar y responder con respeto",
      "Culpar a otro"
    ],
    correct: 2,
    explanation: "La cortesía en momentos difíciles genera confianza."
  },
  {
    type: "vf",
    q: "Ser cortés significa evitar conflictos siempre.",
    options: ["Verdadero", "Falso"],
    correct: 1,
    explanation: "Puedes enfrentar conflictos con respeto."
  },
  {
    type: "mc",
    q: "Tu jefe se equivoca en público.",
    options: [
      "Corregirlo en público",
      "Ignorar",
      "Hablar después en privado",
      "Criticarlo con otros"
    ],
    correct: 2,
    explanation: "La cortesía protege relaciones."
  },
  {
    type: "scenario",
    q: "En una reunión alguien interrumpe constantemente.",
    options: [
      "Interrumpirlo también",
      "Ignorar",
      "Pedir la palabra con respeto",
      "Molestarte en silencio"
    ],
    correct: 2,
    explanation: "La cortesía mantiene el orden profesional."
  },
  {
    type: "mc",
    q: "Un cliente hace muchas preguntas.",
    options: [
      "Responder con molestia",
      "Ignorarlo",
      "Responder con paciencia",
      "Evadir preguntas"
    ],
    correct: 2,
    explanation: "La paciencia es parte de la cortesía."
  },
  {
    type: "vf",
    q: "Pedir disculpas te hace ver débil.",
    options: ["Verdadero", "Falso"],
    correct: 1,
    explanation: "Refuerza tu profesionalismo."
  },
  {
    type: "scenario",
    q: "Un compañero falla en su tarea.",
    options: [
      "Exponerlo",
      "Hablar con él en privado",
      "Ignorarlo",
      "Hacer su trabajo sin decir nada"
    ],
    correct: 1,
    explanation: "La cortesía evita conflictos."
  },
  {
    type: "mc",
    q: "No entiendes una instrucción.",
    options: [
      "Improvisar",
      "Preguntar con respeto",
      "Ignorar",
      "Culpar después"
    ],
    correct: 1,
    explanation: "La cortesía mejora resultados."
  },
  {
    type: "vf",
    q: "La cortesía es solo apariencia.",
    options: ["Verdadero", "Falso"],
    correct: 1,
    explanation: "Es una herramienta profesional."
  },
  {
    type: "scenario",
    q: "Debes dar una mala noticia.",
    options: [
      "Ser frío",
      "Evitar decirlo",
      "Decirlo con empatía",
      "Culpar a otros"
    ],
    correct: 2,
    explanation: "La empatía es clave."
  },
  {
    type: "mc",
    q: "Llegas tarde a una reunión.",
    options: [
      "No decir nada",
      "Justificarte agresivamente",
      "Disculparte",
      "Ignorar"
    ],
    correct: 2,
    explanation: "La cortesía refleja respeto."
  },
  {
    type: "scenario",
    q: "Alguien critica tu trabajo injustamente.",
    options: [
      "Responder agresivo",
      "Ignorar",
      "Responder con calma",
      "Criticar de vuelta"
    ],
    correct: 2,
    explanation: "El autocontrol es clave."
  }
];

let current = 0;
let score = 0;
let timeLeft = 12;
let timer;

function startTimer() {
  timeLeft = 12;
  document.getElementById("timer").innerText = "Tiempo: " + timeLeft;

  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").innerText = "Tiempo: " + timeLeft;

    if (timeLeft === 0) {
      clearInterval(timer);
      nextQuestion();
    }
  }, 1000);
}

function loadQuestion() {
  document.getElementById("result").innerText = "";
  let q = questions[current];

  document.getElementById("question").innerText = q.q;

  let optionsHTML = "";
  q.options.forEach((opt, i) => {
    optionsHTML += `<button onclick="answer(${i})">${opt}</button>`;
  });

  document.getElementById("options").innerHTML = optionsHTML;

  updateProgress();
  startTimer();
}

function answer(option) {
  clearInterval(timer);
  let q = questions[current];

  if (option === q.correct) {
    score += 10;
    document.getElementById("result").innerHTML = "✅ Correcto<br>" + q.explanation;
  } else {
    document.getElementById("result").innerHTML = "❌ Oportunidad perdida<br>" + q.explanation;
  }

  document.getElementById("score").innerText = "Puntaje: " + score;

  setTimeout(nextQuestion, 1200);
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    showFinal();
  }
}

function updateProgress() {
  let percent = (current / questions.length) * 100;
  document.getElementById("progress").style.width = percent + "%";
}

function showFinal() {
  let mensaje = "";

  if (score >= 90) {
    mensaje = "🌟 Nivel experto: Manejas la cortesía estratégicamente.";
  } else if (score >= 70) {
    mensaje = "👍 Buen nivel: Comprendes la importancia de la cortesía.";
  } else {
    mensaje = "⚠️ Puedes mejorar tu manejo de la cortesía.";
  }

  let premio = "";

  if (score >= 70) {
    premio = `
    <hr>
    <p style="font-size:14px;">
    🎉 Felicitaciones. Llegaste hasta el final.  

    Esto demuestra que valoras la forma en que te relacionas con los demás.  

    📌 Muestra esta pantalla a quien te compartió el código QR.  
    Tienes un pequeño reconocimiento por entender que la cortesía no es un detalle,  
    sino una habilidad clave en la vida profesional.
    </p>
    `;
  }

  document.querySelector(".container").innerHTML = `
    <h2>Resultado final</h2>
    <p>${mensaje}</p>
    <p><strong>La cortesía es el bello proceder que define tu perfil profesional.</strong></p>
    ${premio}
  `;
}

loadQuestion();

</script>

</body>
</html>
