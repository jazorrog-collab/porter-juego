<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Michael Porter</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0d1b2a;
        color: white;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    h1, h2 { color: #e0e1dd; }

    .container {
        max-width: 780px;
        margin: auto;
        padding: 20px;
    }

    button {
        background: #1b263b;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        margin: 10px 0;
        cursor: pointer;
        transition: 0.2s;
        width: 90%;
        font-size: 16px;
    }

    button:hover { background: #415a77; }

    .start-btn { background: #778da9; font-size: 20px; }

    .option {
        background: #1b263b;
        border: 2px solid #415a77;
    }

    .correct { background: #2d6a4f !important; }
    .incorrect { background: #9d0208 !important; }

    #quiz-screen, #final-screen, #info-screen {
        display: none;
        animation: fade 0.5s ease;
    }

    @keyframes fade {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #timer {
        font-size: 22px;
        padding: 10px;
        margin-bottom: 10px;
        color: #fcca46;
    }

    #hint-box {
        background: #003049;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        display: none;
    }
</style>
</head>

<body>

<div class="container" id="start-screen">
    <h1>Juego de Michael Porter</h1>
    <p>Aprende sobre estrategia competitiva, ventajas, fuerzas competitivas
       y conceptos clave del pensamiento de Porter.</p>

    <button class="start-btn" onclick="startGame()">Iniciar juego</button>
    <br>

    <button onclick="showInfo('bio')">Biografía</button>
    <button onclick="showInfo('works')">Obras</button>
    <button onclick="showInfo('pubs')">Publicaciones</button>
</div>

<!-- SECCIÓN DE INFORMACIÓN -->
<div class="container" id="info-screen">
    <h2 id="info-title"></h2>
    <p id="info-text"></p>
    <button onclick="goHome()">Volver</button>
</div>

<!-- QUIZ -->
<div class="container" id="quiz-screen">
    <div id="timer">00:00</div>
    <h2 id="question"></h2>
    <div id="options"></div>

    <div id="hint-box"></div>

    <button onclick="useHint()">Usar pista (3 disponibles)</button>
</div>

<!-- PANTALLA FINAL -->
<div class="container" id="final-screen">
    <h1>¡Juego completado!</h1>
    <h2 id="final-score"></h2>
    <button onclick="location.reload()">Jugar de nuevo</button>
</div>

<!-- AUDIOS -->
<audio id="sound-correct" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="sound-wrong" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-buzz-950.mp3"></audio>
<audio id="sound-end" src="https://assets.mixkit.co/sfx/preview/mixkit-level-completed-2059.mp3"></audio>

<script>
/* ---------------------- INFO ---------------------------- */
const infoData = {
    bio: {
        title: "Biografía de Michael Porter",
        text: "Michael E. Porter es profesor de la Universidad de Harvard y uno de los pensadores más influyentes en estrategia moderna. Es reconocido por su modelo de las 5 fuerzas, el concepto de ventaja competitiva y el análisis de clusters. Porter transformó el estudio de la competencia empresarial al introducir un enfoque estructural basado en la industria. Sus investigaciones abarcan competitividad nacional, valor compartido, cadenas de valor y desarrollo económico. Ha asesorado a múltiples gobiernos y corporaciones globales y es considerado el padre de la estrategia competitiva contemporánea."
    },
    works: {
        title: "Principales Obras de Michael Porter",
        text: "Las obras más destacadas de Porter incluyen 'Competitive Strategy' (1980), donde introduce las 5 fuerzas; 'Competitive Advantage' (1985), donde presenta la cadena de valor; y 'The Competitive Advantage of Nations' (1990), donde analiza la competitividad a nivel país. También desarrolló el concepto del diamante competitivo y escribió sobre responsabilidad social empresarial, clusters económicos y valor compartido. Sus libros han sido traducidos a más de 20 idiomas y se utilizan en escuelas de negocio en todo el mundo."
    },
    pubs: {
        title: "Publicaciones Relevantes",
        text: "Entre las publicaciones más influyentes de Porter están artículos como 'What is Strategy?' publicado en Harvard Business Review, uno de los artículos más leídos en la historia de la revista. También destacan sus investigaciones sobre valor compartido, sistemas de salud, competitividad regional y medición de la productividad. Su trabajo continúa siendo referencia obligatoria en estrategia, políticas públicas y economía empresarial."
    }
};

function showInfo(type) {
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("info-screen").style.display = "block";
    document.getElementById("info-title").innerText = infoData[type].title;
    document.getElementById("info-text").innerText = infoData[type].text;
}

function goHome() {
    document.getElementById("info-screen").style.display = "none";
    document.getElementById("start-screen").style.display = "block";
}

/* ------------------------ PREGUNTAS ---------------------------- */

const questions = [
    { q: "¿Cuál es uno de los aportes más conocidos de Michael Porter?",
      options: ["Las 5 fuerzas", "Las 3R", "Matriz BCG"],
      answer: 0,
      hint: "Sirve para analizar el nivel de competencia." },

    { q: "¿Qué representa la cadena de valor?",
      options: ["Actividades internas", "Estados financieros", "Ventas mensuales"],
      answer: 0,
      hint: "Describe cómo la empresa crea valor paso a paso." },

    { q: "¿Qué busca la estrategia competitiva?",
      options: ["Ser diferente", "Imitar al rival", "Reducir marketing"],
      answer: 0,
      hint: "La diferenciación es clave." },

    { q: "Una fuerza del modelo de Porter es:",
      options: ["Rivalidad", "Cultura", "Tamaño"],
      answer: 0,
      hint: "Es la competencia entre empresas del mismo sector." },

    /* --- 11 preguntas nuevas --- */
    { q: "El poder de negociación de proveedores evalúa:",
      options: ["Su influencia en costos", "El clima", "Ventas globales"],
      answer: 0,
      hint: "Afecta los precios y la disponibilidad." },

    { q: "La amenaza de sustitutos implica:",
      options: ["Productos alternos", "Empleados nuevos", "Oficinas"],
      answer: 0,
      hint: "Un ejemplo son apps vs taxis." },

    { q: "¿Qué mide el diamante de Porter?",
      options: ["Competitividad nacional", "Clima", "Marketing"],
      answer: 0,
      hint: "Se usa para evaluar países." },

    { q: "Valor compartido significa:",
      options: ["Beneficio social + económico", "Solo utilidad", "Sólo RSE"],
      answer: 0,
      hint: "Busca impactar sociedad y empresa." },

    { q: "Una ventaja competitiva sostenible es:",
      options: ["Difícil de copiar", "Costosa", "Pequeña"],
      answer: 0,
      hint: "Puede ser tecnología o marca fuerte." },

    { q: "El análisis de industria sirve para:",
      options: ["Predecir competencia", "Diseñar logos", "Elegir colores"],
      answer: 0,
      hint: "Es el primer paso de la estrategia." },

    { q: "Los clusters económicos son:",
      options: ["Concentración de empresas", "Robots", "Aplicaciones"],
      answer: 0,
      hint: "Se agrupan en un territorio." }
];

let index = 0;
let score = 0;
let hints = 3;
let time = 0;
let timerInterval;

/* ----------------------- TIMER ---------------------- */
function startTimer() {
    timerInterval = setInterval(() => {
        time++;
        const m = String(Math.floor(time / 60)).padStart(2, "0");
        const s = String(time % 60).padStart(2, "0");
        document.getElementById("timer").innerText = `${m}:${s}`;
    }, 1000);
}

/* -------------------- INICIAR JUEGO -------------------- */
function startGame() {
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    startTimer();
    loadQuestion();
}

/* ---------------------- CARGAR PREGUNTA ---------------------- */
function loadQuestion() {
    const q = questions[index];
    document.getElementById("question").innerText = q.q;

    const box = document.getElementById("options");
    box.innerHTML = "";

    q.options.forEach((opt, i) => {
        let btn = document.createElement("button");
        btn.classList.add("option");
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(i, btn);
        box.appendChild(btn);
    });

    document.getElementById("hint-box").style.display = "none";
}

/* -------------------- RESPONDER -------------------- */
function checkAnswer(selected, element) {

    vibrate(60);

    const q = questions[index];
    const correctSound = document.getElementById("sound-correct");
    const wrongSound = document.getElementById("sound-wrong");

    if (selected === q.answer) {
        element.classList.add("correct");
        score += 10;
        correctSound.play();
    } else {
        element.classList.add("incorrect");
        wrongSound.play();
    }

    setTimeout(() => {
        index++;
        if (index >= questions.length) finishGame();
        else loadQuestion();
    }, 800);
}

/* ---------------- PISTAS ---------------- */
function useHint() {
    if (hints <= 0) return;

    hints--;
    score -= 3;

    vibrate(40);

    const box = document.getElementById("hint-box");
    box.style.display = "block";
    box.innerText = "Pista: " + questions[index].hint;
}

/* ---------------- VIBRACIÓN ---------------- */
function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
}

/* ---------------- FINAL ---------------- */
function finishGame() {
    clearInterval(timerInterval);
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("final-screen").style.display = "block";
    document.getElementById("final-score").innerText =
        `Puntaje final: ${score} puntos`;

    document.getElementById("sound-end").play();
}
</script>

</body>
</html>
