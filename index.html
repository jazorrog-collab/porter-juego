<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortesía Game</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #f5f0e6, #e8dcc9);
  margin: 0;
}

.container {
  max-width: 420px;
  margin: auto;
  background: #fffaf3;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  animation: fadeIn 0.5s;
}

h2 { color: #5a3e2b; }

button {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: bold;
}

button:active { transform: scale(0.95); }

.btn0 { background:#a47148; }
.btn1 { background:#c19a6b; }
.btn2 { background:#8b5e3c; }
.btn3 { background:#6f4e37; }

.correct { background:#4caf50 !important; }
.wrong { background:#e53935 !important; }

.timerBar {
  height: 6px;
  background: #ddd;
  border-radius: 5px;
  margin: 10px 0;
}

.timerFill {
  height: 6px;
  background: #8b5e3c;
  width: 100%;
  transition: width 1s linear;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

const questions = [
{q:"Un cliente molesto te reclama. ¿Qué haces?",options:["Ignorarlo","Responder igual","Escuchar con respeto","Culpar"],correct:2},
{q:"Ser cortés significa evitar conflictos siempre.",options:["Verdadero","Falso"],correct:1},
{q:"Tu jefe se equivoca en público.",options:["Corregirlo","Ignorar","Hablar en privado","Criticar"],correct:2},
{q:"Interrupciones constantes en reunión.",options:["Interrumpir","Ignorar","Pedir palabra","Molestarte"],correct:2},
{q:"Cliente hace muchas preguntas.",options:["Molestarte","Ignorar","Responder con paciencia","Evadir"],correct:2},
{q:"Pedir disculpas te hace ver débil.",options:["Verdadero","Falso"],correct:1},
{q:"Compañero falla en tarea.",options:["Exponerlo","Hablar privado","Ignorar","Hacer su trabajo"],correct:1},
{q:"No entiendes instrucción.",options:["Improvisar","Preguntar","Ignorar","Culpar"],correct:1},
{q:"La cortesía es solo apariencia.",options:["Verdadero","Falso"],correct:1},
{q:"Debes dar una mala noticia.",options:["Ser frío","Evitar","Con empatía","Culpar"],correct:2}
];

let current=0;
let score=0;
let time=12;
let timer;

function startScreen(){
document.getElementById("app").innerHTML=`
<h2>¿Abres o cierras puertas?</h2>
<p style="font-size:14px;">
La cortesía es una habilidad clave en el mundo profesional.  
Cada decisión puede abrir oportunidades… o cerrarlas.  
Pon a prueba tu criterio en situaciones reales.
</p>
<button onclick="startGame()">Comenzar</button>
`;
}

function startGame(){
current=0;
score=0;
nextQ();
}

function nextQ(){
let q=questions[current];
time=12;

document.getElementById("app").innerHTML=`
<p>Puntaje: ${score}</p>

<div class="timerBar">
<div id="bar" class="timerFill"></div>
</div>

<p>${q.q}</p>

${q.options.map((o,i)=>`
<button class="btn${i}" onclick="answer(${i})">${o}</button>
`).join("")}
`;

timer=setInterval(()=>{
time--;
document.getElementById("bar").style.width=(time/12*100)+"%";

if(time<=0){
clearInterval(timer);
next();
}
},1000);
}

function answer(i){
clearInterval(timer);

let buttons=document.querySelectorAll("button");

buttons.forEach((b,index)=>{
if(index===questions[current].correct){
b.classList.add("correct");
}else if(index===i){
b.classList.add("wrong");
}
});

if(i===questions[current].correct){
score+=time*10;
}

setTimeout(next,800);
}

function next(){
current++;
if(current<questions.length){
nextQ();
}else{
end();
}
}

function end(){
document.getElementById("app").innerHTML=`
<h2>🏆 Puntaje: ${score}</h2>

<p>
Si estás dentro de los 5 puntajes más altos,  
reclama tu paleta 🍬 mostrando esta pantalla.
</p>

<button onclick="startScreen()">Volver a jugar</button>
`;
}

startScreen();

</script>

</body>
</html>
